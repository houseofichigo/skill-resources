name: Validate skill catalogue

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify deterministic distributions
        run: python3 scripts/build_distributions.py --check
      - name: Validate public catalogue
        run: python3 scripts/validate_catalog.py
      - name: Run adversarial release tests
        run: python3 -m unittest discover -s tests -v
