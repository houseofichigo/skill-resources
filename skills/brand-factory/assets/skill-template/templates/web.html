<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{brand}}</title>
<link rel="stylesheet" href="../references/tokens.css">
<style>
  .wrap{max-width:1280px;margin:0 auto;padding:0 64px}
  nav{display:flex;align-items:center;gap:40px;padding:24px 0;
    border-bottom:1px solid var(--line)}
  nav a{color:var(--muted);text-decoration:none;font-family:var(--mono);
    font-size:12px;letter-spacing:.14em;text-transform:uppercase}
  nav a:hover{color:var(--ink)}
  .hero{padding:120px 0}
  .hero h1{font-size:88px;letter-spacing:var(--track-xl);line-height:1}
  .hero p{font-size:20px;color:var(--muted);margin-top:32px;max-width:52ch}
  .cta{display:flex;gap:16px;margin-top:48px}
  /* Every breakpoint is `@media screen and (...)`. A bare one fires
     during PDF export and collapses every column. */
  @media screen and (max-width:820px){
    .wrap{padding:0 20px}.hero{padding:64px 0}.hero h1{font-size:44px}
  }
</style></head>
<body><div class="wrap">
  <nav><strong style="font-family:var(--display)">{{brand}}</strong>
    <a href="#">ONE</a><a href="#">TWO</a><a href="#">THREE</a></nav>
  <section class="hero">
    <h1>HEADLINE WITH ONE <span class="accent">ACCENT</span>.</h1>
    <p>ONE OR TWO SENTENCES.</p>
    <div class="cta">
      <button class="btn btn--primary" style="padding:14px 30px">PRIMARY</button>
      <button class="btn" style="padding:14px 30px;border:1px solid var(--ink);background:none">SECONDARY</button>
    </div>
  </section>
</div></body></html>
